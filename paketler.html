<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap&subset=latin-ext"><link rel="stylesheet" href="css/stil.css?v=78"><link rel="stylesheet" href="css/mobil.css?v=78"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0e1116"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Ses Efekti"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="apple-touch-icon" href="img/apple-touch-icon.png"><title>Gizlilik ve KVKK · sesefekti.com</title><style>.pkGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:1rem}.pk{border:1px solid var(--cizgi);border-radius:12px;padding:1.1rem;display:flex;flex-direction:column;gap:.5rem;background:var(--y2)}.pk.mevcut{border-color:var(--pirinc)}.pk h3{font-size:1.4rem}.pk .fy{font-size:1.5rem;font-weight:600;font-family:"Barlow Condensed",sans-serif}.pk ul{list-style:none;padding:0;margin:.2rem 0 .6rem;color:var(--sol);font-size:14px;display:grid;gap:.3rem}.pk .btn{margin-top:auto}.pk .btn{text-align:center;text-decoration:none}</style></head><body>
<main class="sayfa"><div class="kart"><h1 style="font-size:2rem;margin-bottom:.3rem">Paketler</h1><div class="sol" style="margin-bottom:1rem">İhtiyacınıza uygun paketi seçin. Başvurunuzu yaptıktan sonra havale/EFT ile ödersiniz, ödemeyi gördüğümüzde paketiniz açılır.</div>
<div id="paketler" class="pkGrid"></div><div id="pkNot" class="sol" style="margin-top:1rem"></div></div></main>
<script src="js/vendor/supabase.js"></script><script src="js/config.js?v=78"></script><script src="js/veri.js?v=78"></script><script src="js/dil.js?v=78"></script><script src="js/ortak.js?v=78"></script>
<script>(async function(){
 var o=null;try{o=await Veri.oturum();}catch(e){} await ustCubuk('paketler',o);
 var AY=await Veri.ayarlar(),tl=function(n){return Number(n).toLocaleString('tr-TR')+' TL';};
 function md(m,v){var L=(m||'').split('\n').map(function(x){return x.trim();}).filter(Boolean);return L.length?L:v;}
 var PK=[
  {k:'ucretsiz',ad:AY.paket_ucretsiz_ad,fy:'0 TL',md:md(AY.paket_ucretsiz_md,['Ayda '+AY.ucretsiz_indirme_limiti+' MP3 indirme','Otomatik ve manuel stüdyo'])},
  {k:'pro_aylik',ad:AY.paket_aylik_ad,fy:tl(AY.pro_aylik_fiyat)+' / ay',md:md(AY.paket_aylik_md,[(+AY.pro_aylik_limit?'Ayda '+AY.pro_aylik_limit+' MP3 indirme':'Sınırsız MP3 indirme'),'Yapay zeka modu (ayda '+AY.yz_mesaj_limiti+' mesaj)'])},
  {k:'pro_yillik',ad:AY.paket_yillik_ad,fy:tl(AY.pro_yillik_fiyat)+' / yıl',md:md(AY.paket_yillik_md,[(+AY.pro_yillik_limit?'Ayda '+AY.pro_yillik_limit+' MP3 indirme':'Sınırsız MP3 indirme'),'Yapay zeka modu (ayda '+AY.yz_mesaj_limiti+' mesaj)'])}];
 var bekleyen=null;if(o){try{var B=await Veri.basvurularim();bekleyen=B.filter(function(x){return x.durum==='beklemede';})[0];}catch(e){}}
 var mevcut=o&&Veri.isPro(o.plan)?o.plan:'ucretsiz';
 document.getElementById('paketler').innerHTML=PK.map(function(x){
  var btn;
  if(x.k==='ucretsiz')btn=(!o)?'<a class="btn" href="./">Ücretsiz başla</a>':(mevcut==='ucretsiz'?'<button class="btn" disabled>Mevcut paketiniz</button>':'');
  else if(x.k===mevcut)btn='<button class="btn" disabled>Mevcut paketiniz</button>';
  else if(bekleyen)btn='<button class="btn" disabled>Başvurunuz onay bekliyor</button>';
  else btn='<a class="btn ana" href="panel">'+(o?(Veri.isPro(o.plan)?'Bu pakete geç':'Pro için başvur'):'Giriş yap ve başvur')+'</a>';
  return '<div class="pk'+(x.k===mevcut&&o?' mevcut':'')+'"><h3>'+esc(x.ad)+'</h3><div class="fy">'+x.fy+'</div><ul>'+x.md.map(function(m){return '<li>'+esc(m)+'</li>';}).join('')+'</ul>'+btn+'</div>';
 }).join('');
 if(bekleyen)document.getElementById('pkNot').innerHTML='Başvurunuz alındı, ödeme bilgilerini <a href="panel">Panelim</a> sayfasında görebilirsiniz.';
})();</script></body></html>
